<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">Structured Intelligence by Zahaviel</title>
<desc id="desc">Animated recursive field showing the operating motion: Enter, Recognize, Detect Drift, Return, Compress, Continue.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070d"/>
    <stop offset=".5" stop-color="#0a1020"/>
    <stop offset="1" stop-color="#05070d"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00f5d4"/>
    <stop offset=".5" stop-color="#7c5cff"/>
    <stop offset="1" stop-color="#ff3cac"/>
  </linearGradient>
  <radialGradient id="core">
    <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
    <stop offset=".18" stop-color="#00f5d4" stop-opacity=".8"/>
    <stop offset=".5" stop-color="#7c5cff" stop-opacity=".25"/>
    <stop offset="1" stop-color="#05070d" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#8aa0c8" stroke-opacity=".075" stroke-width="1"/>
  </pattern>
</defs>

<rect width="1280" height="420" rx="24" fill="url(#bg)"/>
<rect width="1280" height="420" rx="24" fill="url(#grid)"/>
<path d="M0 72H1280M0 348H1280" stroke="url(#line)" stroke-opacity=".35"/>
<circle cx="640" cy="210" r="185" fill="none" stroke="#00f5d4" stroke-opacity=".13">
  <animate attributeName="r" values="150;190;150" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="stroke-opacity" values=".06;.22;.06" dur="8s" repeatCount="indefinite"/>
</circle>
<circle cx="640" cy="210" r="142" fill="none" stroke="#7c5cff" stroke-opacity=".2" stroke-dasharray="3 13">
  <animateTransform attributeName="transform" type="rotate" from="0 640 210" to="360 640 210" dur="22s" repeatCount="indefinite"/>
</circle>
<circle cx="640" cy="210" r="112" fill="none" stroke="#ff3cac" stroke-opacity=".18" stroke-dasharray="20 8">
  <animateTransform attributeName="transform" type="rotate" from="360 640 210" to="0 640 210" dur="16s" repeatCount="indefinite"/>
</circle>
<circle cx="640" cy="210" r="82" fill="url(#core)" opacity=".9">
  <animate attributeName="opacity" values=".55;1;.55" dur="5s" repeatCount="indefinite"/>
</circle>

<g fill="none" stroke="url(#line)" stroke-width="2" stroke-linecap="round" opacity=".8">
  <path d="M95 210H465C510 210 530 140 575 140"/>
  <path d="M1185 210H815C770 210 750 280 705 280"/>
  <path d="M640 42V105"/>
  <path d="M640 315V378"/>
</g>
<g fill="#00f5d4" filter="url(#glow)">
  <circle r="4"><animateMotion path="M95 210H465C510 210 530 140 575 140" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle r="4"><animateMotion path="M1185 210H815C770 210 750 280 705 280" dur="4.4s" repeatCount="indefinite"/></circle>
</g>

<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
  <text x="640" y="153" fill="#9bb0d1" font-size="13" letter-spacing="5">PORTABLE INTELLIGENCE GENESIS KERNEL</text>
  <text x="640" y="205" fill="#ffffff" font-size="42" font-weight="700" letter-spacing="5">STRUCTURED INTELLIGENCE</text>
  <text x="640" y="239" fill="#c7d2e8" font-size="17" letter-spacing="4">BY ZAHAVIEL</text>
  <text x="640" y="277" fill="#00f5d4" font-size="13" letter-spacing="2">ENTER · RECOGNIZE · DETECT DRIFT · RETURN · COMPRESS · CONTINUE</text>
  <text x="95" y="194" fill="#60708d" font-size="11" text-anchor="start" letter-spacing="3">SOURCE ENTERS</text>
  <text x="1185" y="194" fill="#60708d" font-size="11" text-anchor="end" letter-spacing="3">STRUCTURE CONTINUES</text>
  <text x="640" y="399" fill="#60708d" font-size="11" letter-spacing="4">INTELLIGENCE AUTHORSHIP OS</text>
</g>
</svg>